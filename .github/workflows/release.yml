name: Build Outfit release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Engine tag (e.g. v0.1.0-alpha.1)
        required: true
      profiles_ref:
        description: Exact public profile commit SHA
        required: true
      profiles_version:
        description: Published profile release tag
        required: true
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
  build:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: outfit
      - uses: actions/checkout@v4
        with:
          repository: johnhenning/outfit-profiles
          ref: ${{ inputs.profiles_ref }}
          path: outfit-profiles
      - uses: actions/setup-go@v5
        with:
          go-version-file: outfit/go.mod
      - name: Verify profile ref
        working-directory: outfit-profiles
        env:
          PROFILE_COMMIT: ${{ inputs.profiles_ref }}
        run: test "$(git rev-parse HEAD)" = "$PROFILE_COMMIT"
      - name: Build release
        working-directory: outfit
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PROFILE_VERSION: ${{ inputs.profiles_version }}
        run: python3 scripts/release.py --version "$RELEASE_VERSION" --profiles ../outfit-profiles --profiles-version "$PROFILE_VERSION"
      - name: Verify published profile bundle
        working-directory: outfit
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_VERSION: ${{ inputs.profiles_version }}
        run: |
          mkdir published
          gh release download "$PROFILE_VERSION" --repo johnhenning/outfit-profiles --pattern "outfit-profiles_${PROFILE_VERSION}.tar.gz" --dir published
          cmp "published/outfit-profiles_${PROFILE_VERSION}.tar.gz" "dist/outfit-profiles_${PROFILE_VERSION}.tar.gz"
      - name: Package generated site
        working-directory: outfit
        run: tar -czf dist/outfit-site.tar.gz -C dist/site .
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            outfit/dist/outfit_v*
            outfit/dist/release-lock.json
      - name: Create draft engine release
        working-directory: outfit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: gh release create "$RELEASE_VERSION" dist/outfit_v* dist/SHA256SUMS dist/release-lock.json dist/outfit-site.tar.gz --target "$GITHUB_SHA" --draft --generate-notes
