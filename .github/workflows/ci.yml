name: Outfit checks
on:
  push:
    branches: [main]
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests/bootstrap -v
        if: runner.os != 'Windows'
      - run: python -m unittest discover -s tests/release -v
      - run: python scripts/test_bootstrap_fixtures.py
      - name: PowerShell bootstrap tests
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester ./tests/bootstrap/bootstrap.Tests.ps1 -CI
      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l cmd internal)"
      - name: Worker routing tests
        if: runner.os == 'Linux'
        run: node --test tests/worker.test.mjs
