name: Deploy release documentation and installers
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Published engine release tag
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: outfit-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact published site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          gh release download "$RELEASE_VERSION" --pattern outfit-site.tar.gz --pattern SHA256SUMS
          grep '  outfit-site.tar.gz$' SHA256SUMS | sha256sum -c -
          mkdir published-site
          tar -xzf outfit-site.tar.gz -C published-site
      - name: Overlay current documentation
        run: cp site/tools/outfit/index.html published-site/tools/outfit/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: published-site
      - uses: actions/deploy-pages@v4
        id: deployment
