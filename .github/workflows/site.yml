name: Deploy release documentation and installers
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Published engine release tag
        required: true
      personal_version:
        description: Published nonsecret personal bundle release
        default: v0.1.0-alpha.3
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: outfit-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact published site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          gh release download "$RELEASE_VERSION" --pattern outfit-site.tar.gz --pattern SHA256SUMS
          grep '  outfit-site.tar.gz$' SHA256SUMS | sha256sum -c -
          mkdir published-site
          tar -xzf outfit-site.tar.gz -C published-site
      - name: Overlay current documentation
        run: |
          cp site/tools/outfit/index.html published-site/tools/outfit/index.html
          mkdir -p published-site/dotfiles
          cp site/dotfiles/index.html published-site/dotfiles/index.html
      - name: Generate pinned personal endpoints
        env:
          GH_TOKEN: ${{ github.token }}
          PERSONAL_VERSION: ${{ inputs.personal_version || 'v0.1.0-alpha.3' }}
          RELEASE_VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          gh release download "$RELEASE_VERSION" --pattern release-lock.json
          grep '  release-lock.json$' SHA256SUMS | sha256sum -c -
          mkdir personal-release
          gh release download "$PERSONAL_VERSION" --repo johnhenning/outfit-personal --pattern "outfit-personal_${PERSONAL_VERSION}.tar.gz" --pattern SHA256SUMS --dir personal-release
          (cd personal-release && sha256sum -c SHA256SUMS)
          python3 scripts/generate_personal_site.py release-lock.json personal-release "$PERSONAL_VERSION" published-site/personal
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generate profile browser from the pinned bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          mkdir browser-engine
          gh release download "$RELEASE_VERSION" --pattern "outfit_${RELEASE_VERSION}_linux_amd64" --dir browser-engine
          chmod +x "browser-engine/outfit_${RELEASE_VERSION}_linux_amd64"
          go run ./cmd/outfit-profile-browser --lock release-lock.json --engine "browser-engine/outfit_${RELEASE_VERSION}_linux_amd64" --output published-site/tools/outfit/profiles/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: published-site
      - uses: actions/deploy-pages@v4
        id: deployment
